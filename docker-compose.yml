services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rolematch
      POSTGRES_PASSWORD: rolematch
      POSTGRES_DB: rolematch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolematch"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://rolematch:rolematch@db:5432/rolematch
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EMBEDDING_DIM: "384"
    ports:
      - "8000:8000"

volumes:
  pgdata:
